name: Deploy Course Application
on:
  pull_request:
    types: [closed]
    branches: [development]
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: vars.COURSE_DEPLOY_ENABLED == 'true' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: course-deploy-${{ github.event.pull_request.user.login }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Select application
        id: app
        env:
          STUDENT: ${{ github.event.pull_request.user.login }}
        run: python scripts/deployment_target.py "$STUDENT" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.deployment_service_account }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.app.outputs.region }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build and push
        env:
          IMAGE: ${{ steps.app.outputs.region }}-docker.pkg.dev/${{ steps.app.outputs.project_id }}/${{ steps.app.outputs.registry }}/${{ steps.app.outputs.service }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy
        env:
          PROJECT: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
          SERVICE: ${{ steps.app.outputs.service }}
          RUNTIME_SA: ${{ steps.app.outputs.runtime_service_account }}
          STUDENT: ${{ steps.app.outputs.folder }}
          TARGET: ${{ steps.app.outputs.target }}
          IMAGE: ${{ steps.app.outputs.region }}-docker.pkg.dev/${{ steps.app.outputs.project_id }}/${{ steps.app.outputs.registry }}/${{ steps.app.outputs.service }}:${{ github.sha }}
          ENABLE_AI: ${{ vars.COURSE_ENABLE_AI || 'false' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          values = {'DEPLOYMENT_TARGET': os.environ['TARGET'], 'GITHUB_USER': os.environ['STUDENT'],
                    'ENABLE_AI': os.environ['ENABLE_AI'], 'GRADIO_ANALYTICS_ENABLED': 'false'}
          if values['ENABLE_AI'].lower() == 'true':
              for key in ['GOOGLE_API_KEY', 'GOOGLE_CSE_ID']:
                  if not os.environ.get(key):
                      raise SystemExit(f'Missing production secret: {key}')
                  values[key] = os.environ[key]
          path = Path(os.environ['RUNNER_TEMP']) / 'course-env.json'
          path.write_text(json.dumps(values))
          path.chmod(0o600)
          PY
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" --service-account "$RUNTIME_SA" \
            --port 8080 --memory 1Gi --cpu 1 --min-instances 0 --max-instances 2 \
            --allow-unauthenticated --env-vars-file "$RUNNER_TEMP/course-env.json" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)'
      - name: Clean deployment environment file
        if: always()
        run: rm -f "$RUNNER_TEMP/course-env.json"
