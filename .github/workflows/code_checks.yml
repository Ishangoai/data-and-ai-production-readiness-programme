name: Code Checks
on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check student change ownership
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          author = os.environ['PR_AUTHOR']
          instructors = json.load(open('course.json'))['instructors']
          if author not in instructors:
              files = subprocess.check_output(['git', 'diff', '--name-only', '-z',
                  os.environ['BASE_SHA'] + '...' + os.environ['HEAD_SHA']]).decode().split('\0')
              invalid = [p for p in files if p and not p.startswith(f'src/students/{author}/')]
              if invalid:
                  raise SystemExit('Student changes must stay in src/students/' + author + '/: ' + ', '.join(invalid))
          PY
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked pytest
